name: Daily Garner Quant Validation

# Runs Garner Quant every morning at 8am UK time
on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: garner-quant-daily-state
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Validate accounting architecture
        run: |
          python scripts/validate_runtime_state_ownership.py
          python scripts/validate_artifact_hygiene.py
          python scripts/validate_runtime_bootstrap.py
          python scripts/validate_atomic_trade_state.py
