name: Deploy to AWS Lightsail

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightsail-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH key
        env:
          AWS_SSH_PRIVATE_KEY_VALUE: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_HOST_VALUE: ${{ secrets.AWS_HOST }}
          AWS_USER_VALUE: ${{ secrets.AWS_USER }}
        run: |
          set -euo pipefail

          if [ -z "$AWS_HOST_VALUE" ]; then
            echo "AWS_HOST secret is missing or empty."
            exit 1
          fi
          if [ -z "$AWS_USER_VALUE" ]; then
            echo "AWS_USER secret is missing or empty."
            exit 1
          fi
          if [ -z "$AWS_SSH_PRIVATE_KEY_VALUE" ]; then
            echo "AWS_SSH_PRIVATE_KEY secret is missing or empty."
            exit 1
          fi

          case "$AWS_SSH_PRIVATE_KEY_VALUE" in
            "-----BEGIN OPENSSH PRIVATE KEY-----"*|"-----BEGIN RSA PRIVATE KEY-----"*|"-----BEGIN EC PRIVATE KEY-----"*|"-----BEGIN DSA PRIVATE KEY-----"*|"-----BEGIN PRIVATE KEY-----"*)
              echo "AWS_SSH_PRIVATE_KEY header validation succeeded."
              ;;
            *)
              echo "AWS_SSH_PRIVATE_KEY is present but does not begin with a supported private-key header."
              exit 1
              ;;
          esac
          if printf '%s' "$AWS_HOST_VALUE" | grep -Eq '://|[[:space:]]|@|/|:'; then
            echo "AWS_HOST must be a bare hostname or IPv4 address only, without protocol, port, username, path, or SSH command prefix."
            exit 1
          fi
          if ! printf '%s' "$AWS_HOST_VALUE" | grep -Eq '^[A-Za-z0-9.-]+$'; then
            echo "AWS_HOST contains unsupported characters. Use only a bare hostname or IPv4 address."
            exit 1
          fi
          echo "AWS_HOST format validation succeeded."
          if timeout 15s getent ahostsv4 "$AWS_HOST_VALUE" >/dev/null 2>&1; then
            echo "AWS_HOST resolution check succeeded."
          else
            aws_host_resolution_status="$?"
            if [ "$aws_host_resolution_status" -eq 124 ]; then
              echo "AWS_HOST resolution check timed out."
            else
              echo "AWS_HOST could not be resolved. Ensure the secret contains a reachable public hostname or IPv4 address."
            fi
            exit 1
          fi

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$AWS_SSH_PRIVATE_KEY_VALUE" > ~/.ssh/lightsail_deploy_key
          chmod 600 ~/.ssh/lightsail_deploy_key
          if ssh-keygen -y -f ~/.ssh/lightsail_deploy_key >/dev/null 2>&1; then
            echo "AWS_SSH_PRIVATE_KEY passed ssh-keygen validation."
          else
            echo "AWS_SSH_PRIVATE_KEY failed ssh-keygen validation."
            exit 1
          fi
          if timeout 15s python3 - "$AWS_HOST_VALUE" <<'PY'
import socket
import sys

host = sys.argv[1]
sock = socket.create_connection((host, 22), timeout=10)
sock.close()
PY
          then
            echo "SSH port 22 connectivity check succeeded."
          else
            aws_host_connectivity_status="$?"
            if [ "$aws_host_connectivity_status" -eq 124 ]; then
              echo "Timed out while testing TCP connectivity to AWS_HOST on port 22."
            else
              echo "AWS_HOST resolved but SSH port 22 is unreachable. Verify the Lightsail instance is running and allows SSH on port 22."
            fi
            exit 1
          fi
          if timeout 30s ssh-keyscan -T 10 -p 22 -H "$AWS_HOST_VALUE" >> ~/.ssh/known_hosts 2>/dev/null; then
            echo "ssh-keyscan succeeded."
          else
            ssh_keyscan_status="$?"
            if [ "$ssh_keyscan_status" -eq 124 ]; then
              echo "ssh-keyscan timed out while connecting to AWS_HOST on port 22."
            else
              echo "ssh-keyscan failed after AWS_HOST format, resolution, and port 22 checks succeeded. Review remote SSH availability and network reachability."
            fi
            exit 1
          fi

      - name: Deploy on Lightsail
        run: |
          set +e
          timeout --foreground --signal=TERM --kill-after=30s 60m \
          ssh -i ~/.ssh/lightsail_deploy_key \
            -o IdentitiesOnly=yes \
            -o ConnectTimeout=30 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=60 \
            "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" \
            'bash -s' <<'REMOTE_DEPLOY'
          set -euo pipefail

          APP_DIR="/home/ubuntu/garner-quant"
          DASHBOARD_SERVICE="garner-quant-dashboard"
          RUNTIME_SERVICE="garner-quant-runtime"
          COMPOSE_FILE="$APP_DIR/docker-compose.dashboard.yml"
          API_SERVICE="garner-quant-dashboard-api"
          FRONTEND_SERVICE="garner-quant-dashboard-preview"
          API_CONTAINER="garner-quant-dashboard-api"
          FRONTEND_CONTAINER="garner-quant-dashboard-preview"
          SERVICE_TIMEOUT="2m"
          GIT_TIMEOUT="5m"
          PIP_TIMEOUT="15m"
          APT_TIMEOUT="15m"
          COMPOSE_BUILD_TIMEOUT="30m"
          COMPOSE_UP_TIMEOUT="10m"

          cd "$APP_DIR"

          exec 9>/tmp/garner-quant-deploy.lock
          flock -n 9 || {
            echo "Another deployment is already running."
            exit 1
          }

          if ! timeout --foreground --kill-after=15s 30s sudo -n true; then
            echo "Passwordless sudo is required for deployment automation on this host."
            exit 1
          fi

          RUNTIME_BACKUP="$(mktemp -d)"
          RUNTIME_RESTORED=false
          DASHBOARD_WAS_ACTIVE=false
          RUNTIME_WAS_ACTIVE=false

          run_with_timeout() {
            local label="$1"
            local timeout_limit="$2"
            shift 2
            echo "START: $label"
            if timeout --foreground --signal=TERM --kill-after=30s "$timeout_limit" "$@"; then
              echo "DONE: $label"
            else
              local status="$?"
              if [ "$status" -eq 124 ]; then
                echo "TIMEOUT: $label exceeded $timeout_limit."
              else
                echo "FAILED: $label exited with status $status."
              fi
              return "$status"
            fi
          }

          run_sudo_with_timeout() {
            local label="$1"
            local timeout_limit="$2"
            shift 2
            run_with_timeout "$label" "$timeout_limit" sudo -n "$@"
          }

          report_apt_locks() {
            local lock_path=""
            local owner_info=""
            local lock_detected=false
            if ! command -v fuser >/dev/null 2>&1; then
              echo "The 'fuser' command is unavailable; apt/dpkg lock holders cannot be inspected on this host."
              return 0
            fi
            for lock_path in /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock; do
              owner_info="$(sudo -n fuser "$lock_path" 2>/dev/null || true)"
              if [ -n "$owner_info" ]; then
                echo "Active apt/dpkg lock detected: $lock_path (holders: $owner_info)"
                lock_detected=true
              fi
            done
            if [ "$lock_detected" = false ]; then
              echo "No active apt/dpkg locks detected."
            fi
          }

          fail_if_apt_locked() {
            local lock_path=""
            local owner_info=""
            local lock_detected=false
            if ! command -v fuser >/dev/null 2>&1; then
              echo "The 'fuser' command is unavailable; continuing without lock-owner inspection."
              return 0
            fi
            for lock_path in /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock /var/cache/apt/archives/lock; do
              owner_info="$(sudo -n fuser "$lock_path" 2>/dev/null || true)"
              if [ -n "$owner_info" ]; then
                echo "Active apt/dpkg lock detected: $lock_path (holders: $owner_info)"
                lock_detected=true
              fi
            done
            if [ "$lock_detected" = true ]; then
              echo "Cannot continue while another apt/dpkg process is holding a lock."
              return 1
            fi
          }

          run_apt_get() {
            local label="$1"
            shift
            echo "START: $label"
            if ! fail_if_apt_locked; then
              return 1
            fi
            if timeout --foreground --signal=TERM --kill-after=30s "$APT_TIMEOUT" \
              sudo -n env DEBIAN_FRONTEND=noninteractive apt-get \
                -o DPkg::Lock::Timeout=60 \
                -o Acquire::Retries=2 \
                -o Acquire::http::Timeout=30 \
                -o Acquire::https::Timeout=30 \
                "$@"; then
              echo "DONE: $label"
            else
              local status="$?"
              if [ "$status" -eq 124 ]; then
                echo "TIMEOUT: $label exceeded $APT_TIMEOUT."
              else
                echo "FAILED: $label exited with status $status."
              fi
              report_apt_locks
              return "$status"
            fi
          }

          ensure_service_running_after_failure() {
            local service="$1"
            if timeout --foreground --kill-after=15s "$SERVICE_TIMEOUT" sudo -n systemctl is-active --quiet "$service"; then
              echo "Recovery: $service is already running."
            else
              echo "Recovery: starting $service after failed deployment..."
              timeout --foreground --kill-after=15s "$SERVICE_TIMEOUT" sudo -n systemctl start "$service" || echo "Recovery failed for $service."
            fi
          }

          restore_existing_services_after_failure() {
            ensure_service_running_after_failure "$DASHBOARD_SERVICE"
            ensure_service_running_after_failure "$RUNTIME_SERVICE"
          }
          cleanup_deployment() {
            local status="$?"
            if [ "$status" -ne 0 ]; then
              echo "Deployment failed with status $status. Existing service recovery is being checked."
              restore_existing_services_after_failure
            fi
            if [ "$RUNTIME_RESTORED" = true ]; then
              rm -rf "$RUNTIME_BACKUP"
            else
              echo "Deployment failed before runtime-state restoration completed."
              echo "Recovery backup retained at: $RUNTIME_BACKUP"
            fi
            exit "$status"
          }
          trap cleanup_deployment EXIT

          timeout --foreground --kill-after=15s "$SERVICE_TIMEOUT" sudo -n systemctl is-active --quiet "$DASHBOARD_SERVICE" && DASHBOARD_WAS_ACTIVE=true
          timeout --foreground --kill-after=15s "$SERVICE_TIMEOUT" sudo -n systemctl is-active --quiet "$RUNTIME_SERVICE" && RUNTIME_WAS_ACTIVE=true
          PRE_DEPLOY_HEAD="$(git rev-parse HEAD 2>/dev/null || true)"

          echo "Preserving server-owned runtime state..."
          while IFS= read -r runtime_path; do
            runtime_path="${runtime_path%%#*}"
            runtime_path="${runtime_path%$'\r'}"
            [ -n "$runtime_path" ] || continue
            case "$runtime_path" in
              /*|..|../*|*/../*|*/..|.env|.env/*|.streamlit/secrets.toml)
                echo "Unsafe runtime backup path: $runtime_path"
                exit 1
                ;;
            esac
            if ! git check-ignore -q -- "$runtime_path"; then
              echo "Runtime backup path is not Git-ignored: $runtime_path"
              exit 1
            fi
            if [ -d "$runtime_path" ]; then
              mkdir -p "$RUNTIME_BACKUP/$runtime_path"
              cp -a "$runtime_path/." "$RUNTIME_BACKUP/$runtime_path/"
            elif [ -f "$runtime_path" ]; then
              mkdir -p "$RUNTIME_BACKUP/$(dirname "$runtime_path")"
              cp -a "$runtime_path" "$RUNTIME_BACKUP/$runtime_path"
            fi
          done < runtime/generated_runtime_files.txt

          run_with_timeout "Fetch latest main" "$GIT_TIMEOUT" git fetch origin main
          run_with_timeout "Reset deployment checkout to origin/main" "$GIT_TIMEOUT" git reset --hard origin/main
          TARGET_DEPLOY_HEAD="$(git rev-parse HEAD)"

          echo "Restoring server-owned runtime state..."
          cp -a "$RUNTIME_BACKUP/." "$APP_DIR/"
          RUNTIME_RESTORED=true

          echo "Installing/updating dependencies..."
          if [ ! -d ".venv" ]; then
            run_with_timeout "Create Python virtualenv" 5m python3 -m venv .venv
          fi
          run_with_timeout "Upgrade pip" "$PIP_TIMEOUT" .venv/bin/python -m pip install --disable-pip-version-check --upgrade pip
          run_with_timeout "Install Python requirements" "$PIP_TIMEOUT" .venv/bin/python -m pip install --disable-pip-version-check -r requirements.txt

          echo "Running startup validation..."
          if ! run_with_timeout "Run startup validation" 5m .venv/bin/python -m runtime.startup_validation; then
            echo "Startup validation failed. Existing services were not restarted."
            timeout --foreground --kill-after=15s "$SERVICE_TIMEOUT" sudo -n systemctl status "$DASHBOARD_SERVICE" --no-pager || true
            timeout --foreground --kill-after=15s "$SERVICE_TIMEOUT" sudo -n systemctl status "$RUNTIME_SERVICE" --no-pager || true
            exit 1
          fi

          ensure_docker_compose() {
            local compose_package=""
            local docker_codename=""
            local docker_architecture=""

            echo "Checking Docker and Docker Compose v2 availability..."
            if command -v docker >/dev/null 2>&1; then
              timeout --foreground --kill-after=15s 30s sudo -n docker --version || docker --version || true
            else
              echo "Docker CLI is not installed."
            fi
            if command -v docker >/dev/null 2>&1 && timeout --foreground --kill-after=15s 30s sudo -n docker compose version >/dev/null 2>&1; then
              echo "Docker Compose v2 is already available: $(timeout --foreground --kill-after=15s 30s sudo -n docker compose version)"
            else
              echo "Docker Compose v2 is unavailable; starting installation."
              if ! command -v apt-get >/dev/null 2>&1; then
                echo "Cannot install Docker Compose v2: apt-get is unavailable on this host."
                return 1
              fi

              report_apt_locks
              run_apt_get "Refresh apt package metadata" update
              if timeout --foreground --kill-after=15s 30s apt-cache show docker-compose-v2 >/dev/null 2>&1; then
                compose_package="docker-compose-v2"
              elif timeout --foreground --kill-after=15s 30s apt-cache show docker-compose-plugin >/dev/null 2>&1; then
                compose_package="docker-compose-plugin"
              fi

              if [ -n "$compose_package" ]; then
                echo "Using Ubuntu package sources for Docker Compose v2."
                if command -v docker >/dev/null 2>&1; then
                  run_apt_get "Install $compose_package" install -y "$compose_package"
                else
                  run_apt_get "Install docker.io and $compose_package" install -y docker.io "$compose_package"
                fi
              else
                echo "Ubuntu package sources do not provide a Compose v2 package; enabling Docker's official apt repository..."
                run_apt_get "Install Docker apt prerequisites" install -y ca-certificates curl gnupg
                . /etc/os-release
                docker_codename="${VERSION_CODENAME:-${UBUNTU_CODENAME:-}}"
                if [ -z "$docker_codename" ]; then
                  echo "Cannot determine the Ubuntu release codename for Docker's apt repository."
                  return 1
                fi
                docker_architecture="$(dpkg --print-architecture)"
                run_sudo_with_timeout "Create Docker apt keyring directory" 30s install -m 0755 -d /etc/apt/keyrings
                echo "START: Download Docker GPG key"
                if timeout --foreground --signal=TERM --kill-after=30s 2m \
                  curl --fail --silent --show-error --location --connect-timeout 15 --max-time 60 https://download.docker.com/linux/ubuntu/gpg \
                  | sudo -n gpg --dearmor --yes -o /etc/apt/keyrings/docker.gpg; then
                  echo "DONE: Download Docker GPG key"
                else
                  local status="$?"
                  if [ "$status" -eq 124 ]; then
                    echo "TIMEOUT: Download Docker GPG key exceeded 2m."
                  else
                    echo "FAILED: Download Docker GPG key exited with status $status."
                  fi
                  return "$status"
                fi
                run_sudo_with_timeout "Set Docker GPG key permissions" 30s chmod a+r /etc/apt/keyrings/docker.gpg
                echo "START: Register Docker apt repository"
                if printf 'deb [arch=%s signed-by=/etc/apt/keyrings/docker.gpg] https://download.docker.com/linux/ubuntu %s stable\n' "$docker_architecture" "$docker_codename" \
                  | timeout --foreground --signal=TERM --kill-after=30s 30s sudo -n tee /etc/apt/sources.list.d/docker.list >/dev/null
                then
                  echo "DONE: Register Docker apt repository"
                else
                  local status="$?"
                  if [ "$status" -eq 124 ]; then
                    echo "TIMEOUT: Register Docker apt repository exceeded 30s."
                  else
                    echo "FAILED: Register Docker apt repository exited with status $status."
                  fi
                  return "$status"
                fi
                run_apt_get "Refresh apt package metadata for Docker repository" update
                if command -v docker >/dev/null 2>&1; then
                  run_apt_get "Install docker-compose-plugin" install -y docker-compose-plugin
                else
                  run_apt_get "Install Docker Engine and Compose v2" install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                fi
              fi
            fi

            run_sudo_with_timeout "Enable and start Docker daemon" "$SERVICE_TIMEOUT" systemctl enable --now docker
            echo "START: Verify Docker Compose v2"
            if ! timeout --foreground --kill-after=15s 30s sudo -n docker compose version >/dev/null 2>&1; then
              echo "Docker Compose v2 installation completed but 'sudo docker compose' is still unavailable."
              timeout --foreground --kill-after=15s 30s sudo -n docker --version || true
              return 1
            fi
            echo "DONE: Verify Docker Compose v2"
            echo "Using: $(timeout --foreground --kill-after=15s 30s sudo -n docker compose version)"
          }

          ensure_docker_compose
          DOCKER=(sudo -n docker)
          COMPOSE=(env COMPOSE_DISABLE_ENV_FILE=1 "${DOCKER[@]}" compose -f "$COMPOSE_FILE")

          run_with_timeout "Validate dashboard Compose configuration" 2m "${COMPOSE[@]}" config -q

          dashboard_sources_changed=false
          if [ -n "$PRE_DEPLOY_HEAD" ] && [ "$PRE_DEPLOY_HEAD" != "$TARGET_DEPLOY_HEAD" ]; then
            if ! git diff --quiet "$PRE_DEPLOY_HEAD" "$TARGET_DEPLOY_HEAD" -- docker-compose.dashboard.yml dashboard-api dashboard-web; then
              dashboard_sources_changed=true
            fi
          fi

          dashboard_images_missing=false
          for dashboard_service in "$API_SERVICE" "$FRONTEND_SERVICE"; do
            dashboard_image_id="$("${COMPOSE[@]}" images -q "$dashboard_service" 2>/dev/null | tr -d '\r')"
            if [ -z "$dashboard_image_id" ]; then
              echo "No cached image found for $dashboard_service."
              dashboard_images_missing=true
            fi
          done

          if [ "$dashboard_sources_changed" = true ] || [ "$dashboard_images_missing" = true ]; then
            run_with_timeout "Build dashboard images" "$COMPOSE_BUILD_TIMEOUT" "${COMPOSE[@]}" build --progress plain "$API_SERVICE" "$FRONTEND_SERVICE"
          else
            echo "Dashboard sources are unchanged and cached images are present; skipping rebuild."
          fi

          run_with_timeout "Start the read-only dashboard API and Next.js frontend" "$COMPOSE_UP_TIMEOUT" "${COMPOSE[@]}" up -d --no-build "$API_SERVICE" "$FRONTEND_SERVICE"

          wait_for_container_health() {
            local container="$1"
            local attempts=30
            local health=""
            for _ in $(seq 1 "$attempts"); do
              health="$("${DOCKER[@]}" inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container" 2>/dev/null || true)"
              case "$health" in
                healthy)
                  echo "$container is healthy."
                  return 0
                  ;;
                unhealthy)
                  echo "$container reported unhealthy."
                  "${DOCKER[@]}" logs --tail 100 "$container" || true
                  return 1
                  ;;
              esac
              sleep 2
            done
            echo "Timed out waiting for $container health; last status: ${health:-missing}"
            "${DOCKER[@]}" logs --tail 100 "$container" || true
            return 1
          }

          wait_for_container_health "$API_CONTAINER"
          wait_for_container_health "$FRONTEND_CONTAINER"

          echo "Checking the externally served Next.js frontend on port 3000..."
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/ >/dev/null

          start_or_restart_and_check_systemd_service() {
            local service="$1"
            local was_active="$2"
            if [ "$was_active" = true ]; then
              run_sudo_with_timeout "Restart active $service" "$SERVICE_TIMEOUT" systemctl restart "$service"
            else
              run_sudo_with_timeout "Start inactive $service for production health checks" "$SERVICE_TIMEOUT" systemctl start "$service"
            fi
            run_sudo_with_timeout "Confirm $service is active" "$SERVICE_TIMEOUT" systemctl is-active --quiet "$service"
          }

          start_or_restart_and_check_systemd_service "$DASHBOARD_SERVICE" "$DASHBOARD_WAS_ACTIVE"
          start_or_restart_and_check_systemd_service "$RUNTIME_SERVICE" "$RUNTIME_WAS_ACTIVE"

          echo "Checking Streamlit dashboard on port 8501..."
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8501/ >/dev/null

          echo "Checking runtime health..."
          .venv/bin/python runtime/health_check.py

          echo "Service status:"
          timeout --foreground --kill-after=15s "$SERVICE_TIMEOUT" sudo -n systemctl status "$DASHBOARD_SERVICE" --no-pager
          timeout --foreground --kill-after=15s "$SERVICE_TIMEOUT" sudo -n systemctl status "$RUNTIME_SERVICE" --no-pager
          run_with_timeout "Show dashboard Compose service status" 2m "${COMPOSE[@]}" ps
          REMOTE_DEPLOY
          ssh_status=$?
          set -e
          if [ "$ssh_status" -eq 124 ]; then
            echo "Remote deployment exceeded the 60-minute timeout."
          elif [ "$ssh_status" -ne 0 ]; then
            echo "Remote deployment exited with status $ssh_status."
          fi
          exit "$ssh_status"
