name: Deploy to AWS Lightsail

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lightsail-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Configure SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.AWS_SSH_PRIVATE_KEY }}" > ~/.ssh/lightsail_deploy_key
          chmod 600 ~/.ssh/lightsail_deploy_key
          ssh-keyscan -H "${{ secrets.AWS_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy on Lightsail
        run: |
          ssh -i ~/.ssh/lightsail_deploy_key \
            -o IdentitiesOnly=yes \
            "${{ secrets.AWS_USER }}@${{ secrets.AWS_HOST }}" \
            'bash -s' <<'REMOTE_DEPLOY'
          set -euo pipefail

          APP_DIR="/home/ubuntu/garner-quant"
          DASHBOARD_SERVICE="garner-quant-dashboard"
          RUNTIME_SERVICE="garner-quant-runtime"
          COMPOSE_FILE="$APP_DIR/docker-compose.dashboard.yml"
          API_CONTAINER="garner-quant-dashboard-api"
          FRONTEND_CONTAINER="garner-quant-dashboard-preview"

          cd "$APP_DIR"

          exec 9>/tmp/garner-quant-deploy.lock
          flock -n 9 || {
            echo "Another deployment is already running."
            exit 1
          }

          RUNTIME_BACKUP="$(mktemp -d)"
          RUNTIME_RESTORED=false
          cleanup_runtime_backup() {
            if [ "$RUNTIME_RESTORED" = true ]; then
              rm -rf "$RUNTIME_BACKUP"
            else
              echo "Deployment failed before runtime-state restoration completed."
              echo "Recovery backup retained at: $RUNTIME_BACKUP"
            fi
          }
          trap cleanup_runtime_backup EXIT

          DASHBOARD_WAS_ACTIVE=false
          RUNTIME_WAS_ACTIVE=false
          sudo systemctl is-active --quiet "$DASHBOARD_SERVICE" && DASHBOARD_WAS_ACTIVE=true
          sudo systemctl is-active --quiet "$RUNTIME_SERVICE" && RUNTIME_WAS_ACTIVE=true

          echo "Preserving server-owned runtime state..."
          while IFS= read -r runtime_path; do
            runtime_path="${runtime_path%%#*}"
            runtime_path="${runtime_path%$'\r'}"
            [ -n "$runtime_path" ] || continue
            case "$runtime_path" in
              /*|..|../*|*/../*|*/..|.env|.env/*|.streamlit/secrets.toml)
                echo "Unsafe runtime backup path: $runtime_path"
                exit 1
                ;;
            esac
            if ! git check-ignore -q -- "$runtime_path"; then
              echo "Runtime backup path is not Git-ignored: $runtime_path"
              exit 1
            fi
            if [ -d "$runtime_path" ]; then
              mkdir -p "$RUNTIME_BACKUP/$runtime_path"
              cp -a "$runtime_path/." "$RUNTIME_BACKUP/$runtime_path/"
            elif [ -f "$runtime_path" ]; then
              mkdir -p "$RUNTIME_BACKUP/$(dirname "$runtime_path")"
              cp -a "$runtime_path" "$RUNTIME_BACKUP/$runtime_path"
            fi
          done < runtime/generated_runtime_files.txt

          echo "Fetching latest main..."
          git fetch origin main
          git reset --hard origin/main

          echo "Restoring server-owned runtime state..."
          cp -a "$RUNTIME_BACKUP/." "$APP_DIR/"
          RUNTIME_RESTORED=true

          echo "Installing/updating dependencies..."
          if [ ! -d ".venv" ]; then
            python3 -m venv .venv
          fi
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

          echo "Running startup validation..."
          if ! .venv/bin/python -m runtime.startup_validation; then
            echo "Startup validation failed. Existing services were not restarted."
            sudo systemctl status "$DASHBOARD_SERVICE" --no-pager || true
            sudo systemctl status "$RUNTIME_SERVICE" --no-pager || true
            exit 1
          fi

          if ! command -v docker >/dev/null 2>&1 || ! docker compose version >/dev/null 2>&1; then
            echo "Docker Compose is required to run the dashboard API and Next.js frontend."
            exit 1
          fi

          echo "Validating dashboard Compose configuration..."
          docker compose -f "$COMPOSE_FILE" config -q

          echo "Building and starting the read-only dashboard API and Next.js frontend..."
          docker compose -f "$COMPOSE_FILE" up -d --build "$API_CONTAINER" "$FRONTEND_CONTAINER"

          wait_for_container_health() {
            local container="$1"
            local attempts=30
            local health=""
            for _ in $(seq 1 "$attempts"); do
              health="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}no-healthcheck{{end}}' "$container" 2>/dev/null || true)"
              case "$health" in
                healthy)
                  echo "$container is healthy."
                  return 0
                  ;;
                unhealthy)
                  echo "$container reported unhealthy."
                  docker logs --tail 100 "$container" || true
                  return 1
                  ;;
              esac
              sleep 2
            done
            echo "Timed out waiting for $container health; last status: ${health:-missing}"
            docker logs --tail 100 "$container" || true
            return 1
          }

          wait_for_container_health "$API_CONTAINER"
          wait_for_container_health "$FRONTEND_CONTAINER"

          echo "Checking the externally served Next.js frontend on port 3000..."
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:3000/ >/dev/null

          start_or_restart_and_check_systemd_service() {
            local service="$1"
            local was_active="$2"
            if [ "$was_active" = true ]; then
              echo "Restarting active $service..."
              sudo systemctl restart "$service"
            else
              echo "$service was inactive before deployment; starting it for production health checks."
              sudo systemctl start "$service"
            fi
            sudo systemctl is-active --quiet "$service"
          }

          start_or_restart_and_check_systemd_service "$DASHBOARD_SERVICE" "$DASHBOARD_WAS_ACTIVE"
          start_or_restart_and_check_systemd_service "$RUNTIME_SERVICE" "$RUNTIME_WAS_ACTIVE"

          echo "Checking Streamlit dashboard on port 8501..."
          curl --fail --silent --show-error --max-time 10 http://127.0.0.1:8501/ >/dev/null

          echo "Checking runtime health..."
          .venv/bin/python runtime/health_check.py

          echo "Service status:"
          sudo systemctl status "$DASHBOARD_SERVICE" --no-pager
          sudo systemctl status "$RUNTIME_SERVICE" --no-pager
          docker compose -f "$COMPOSE_FILE" ps
          REMOTE_DEPLOY
