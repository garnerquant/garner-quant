services:
  garner-quant-dashboard-api:
    build:
      context: ./dashboard-api
      dockerfile: Dockerfile
    container_name: garner-quant-dashboard-api
    restart: unless-stopped
    volumes:
      - ./portfolio_v2.csv:/data/snapshots/portfolio_v2.csv:ro
      - ./holdings_report.csv:/data/snapshots/holdings_report.csv:ro
      - ./signal_report_v2.csv:/data/snapshots/signal_report_v2.csv:ro
      - ./runtime/live_runtime_config.json:/data/config/live_runtime_config.json:ro
      - ./risk_engine/risk_config.json:/data/config/risk_config.json:ro
      - ./data/continuous_research/morning_reports:/data/research:ro
      - ./docs/baseline_evidence_manifest.json:/data/audit/baseline_evidence_manifest.json:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/health', timeout=3)\""]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 10s

  garner-quant-dashboard-preview:
    build:
      context: ./dashboard-web
      dockerfile: Dockerfile
    container_name: garner-quant-dashboard-preview
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      DASHBOARD_API_URL: http://garner-quant-dashboard-api:8000
    depends_on:
      garner-quant-dashboard-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
