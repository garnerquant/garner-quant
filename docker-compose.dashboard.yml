services:
  garner-quant-dashboard-preview:
    build:
      context: ./dashboard-web
      dockerfile: Dockerfile
    container_name: garner-quant-dashboard-preview
    ports:
      - "3000:3000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
